aid: fortem-technologies
name: Fortem Technologies
description: >-
  Fortem Technologies is an airspace security and defense company based in Lindon, Utah that
  builds counter-unmanned aircraft systems (C-UAS) for military, government, critical
  infrastructure, and commercial customers. Its SkyDome System combines TrueView AESA radars,
  long-range TrueView cameras, RF sensors, and the autonomous DroneHunter interceptor into a
  single detect-track-defeat capability, orchestrated by SkyDome Manager command-and-control
  software. SkyDome Manager exposes REST, realtime, and track-only integration APIs so third-party
  C2 platforms (such as the U.S. Army FAAD C2 and Lockheed Martin systems) can exchange over a
  hundred fields and commands for airspace awareness and drone mitigation. Fortem is backed by
  Lockheed Martin, DCVC, Toshiba, Boeing, and other strategic investors, and its systems have been
  selected for high-profile deployments including protection of venues at the 2026 FIFA World Cup.
